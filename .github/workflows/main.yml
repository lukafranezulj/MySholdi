# Automatska izgradnja Android aplikacije MySholdi
# - svaki push na main: debug APK (+ potpisani release APK i AAB ako postoje tajne za ključ)
# - oznaka (tag) v1.2.3: dodatno se stvara GitHub Release s APK-om i AAB-om
# Workflow sam pronalazi mapu projekta (radi i ako je projekt u podmapi repozitorija).
name: Android build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Pronađi mapu projekta
        run: |
          CFG=$(find . -name capacitor.config.json -not -path '*/node_modules/*' -not -path '*/android/*' | head -n 1)
          if [ -z "$CFG" ]; then echo "::error::capacitor.config.json nije pronađen – jesu li sve datoteke prenesene?"; exit 1; fi
          P=$(dirname "$CFG")
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
          echo "Projekt je u: $P"; ls -la "$P"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Verzija
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Verzija: $V (code $VERSION_CODE)"

      - name: Instalacija ovisnosti
        working-directory: ${{ env.PROJECT_DIR }}
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Izgradnja web dijela
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Capacitor sync
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Ključ za potpisivanje
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Release APK i AAB (potpisani)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Preimenovanje
        run: |
          O="$PROJECT_DIR/android/app/build/outputs"
          mkdir -p out
          cp "$O/apk/debug/app-debug.apk" "out/MySholdi-${VERSION_NAME}-debug.apk"
          if [ -f "$O/apk/release/app-release.apk" ]; then
            cp "$O/apk/release/app-release.apk" "out/MySholdi-${VERSION_NAME}.apk"
            cp "$O/bundle/release/app-release.aab" "out/MySholdi-${VERSION_NAME}.aab"
          fi
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: MySholdi-${{ env.VERSION_NAME }}
          path: out/*
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
